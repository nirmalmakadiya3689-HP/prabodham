function importQ(f){const r=new FileReader();r.onload=()=>{try{const a=JSON.parse(r.result).filter(q=>q.q&&Array.isArray(q.o)&&q.o.length==4&&q.a>=0&&q.a<4&&G[q.s]);S.qb=(S.qb||[]).concat(a);save();alert(a.length+' questions imported');render()}catch(e){alert('Invalid file')}};r.readAsText(f)}

 X={qs,ans:[],i:0,end:Date.now()+m*6e4,sub:sb};X.iv=setInterval(()=>{const r=Math.round((X.end-Date.now())/1e3),e=$('#xt');if(e)e.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');if(r<=0)finishX()},1000);render()}

 if(X){const q=X.qs[X.i];return `<div class="card"><div class="row"><span class="pill">${q.s} ${X.i+1}/${X.qs.length}</span><b id="xt" style="flex:none"></b></div><p>${sci(q.q)}</p>${q.o.map((o,k)=>`<button class="${X.ans[X.i]==k?'':'g'}" style="display:block;width:100%;margin:6px 0;text-align:left" onclick="X.ans[X.i]=${k};render()">${'ABCD'[k]}. ${sci(o)}</button>`).join('')}<div class="row"><button class="g" onclick="X.i=Math.max(0,X.i-1);render()">‹</button><button class="g" onclick="X.i=Math.min(X.qs.length-1,X.i+1);render()">›</button><button onclick="finishX()">Submit</button></div></div>`}
 return `<div class="card"><b>🎯 JEE training ops</b><div class="mut">Auto-generated Physics, Chemistry and Maths questions, new every time. Marking: +4 / −1.</div><select id="xs"><option>All</option><option>Physics</option><option>Chemistry</option><option>Maths</option></select><div class="row"><label class="mut">Questions<input id="xn" type="number" value="15"></label><label class="mut">Minutes<input id="xm" type="number" value="20"></label></div><button onclick="startX()">Begin test</button></div><div class="card"><b>📥 Import question bank</b><div class="mut">JSON file: [{"s":"Physics","q":"Question","o":["A","B","C","D"],"a":0}] (s = Physics, Chemistry or Maths; a = index of the right option). Saved to your Drive. You can write LaTeX such as $\frac{1}{2}mv^2$ or $\ce{H2O}$. Imported so far: ${(S.qb||[]).length}.</div><input type="file" accept=".json" onchange="importQ(this.files[0])"></div><div class="card"><b>Past operations</b>${(S.tests||[]).slice(-6).reverse().map(t=>`<div class="t"><span class="x">${t.date} · ${t.sub}</span><span class="pill">${t.sc}/${t.max}</span></div>`).join('')||'<div class="mut">No tests yet.</div>'}</div>`};
