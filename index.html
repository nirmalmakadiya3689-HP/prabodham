<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prabodham Academy</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#76746d;--ac:#2f6f5e;--ac2:#e8f1ee;--bd:#e4e2da;--rd:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141514;--card:#1e201f;--tx:#eceae4;--mut:#9a978f;--ac:#5fc0a4;--ac2:#22332e;--bd:#2f322f;--rd:#e5604f}}
*{box-sizing:border-box}body{margin:0;font:16px var(--f,ui-monospace,monospace);background:var(--bg);color:var(--tx);padding-bottom:170px}button:not(.g):not(.r){color:var(--bg)}
main{max-width:640px;margin:auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px;display:flex;justify-content:space-between;align-items:center}
h2{font-size:15px;color:var(--mut);margin:18px 0 8px;font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:10px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font:inherit;cursor:pointer}
button.g{background:var(--ac2);color:var(--ac)}button.r{background:none;color:var(--rd);padding:4px 8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>button{flex:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;font-size:11px;padding:10px 2px}
nav button.on{color:var(--ac);font-weight:700}nav span{display:block;font-size:20px}
.big{font-size:56px;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.t{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.t:last-child{border:0}
.t.d span.x{text-decoration:line-through;color:var(--mut)}.t .x{flex:1}.t input{width:auto;margin:0}
.dot{width:26px;height:26px;border-radius:7px;border:1px solid var(--bd);display:inline-block;background:var(--bg);font-size:10px;text-align:center;line-height:26px;color:var(--mut)}
.dot.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--ac2);color:var(--ac)}
.bar{height:10px;background:var(--ac2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.mut{color:var(--mut);font-size:13px}
#lock{position:fixed;inset:0;background:#0d1110;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:9;text-align:center;padding:20px}
#lock .big{font-size:72px}
.msg{background:var(--ac2);padding:8px 12px;border-radius:12px;margin:4px 0;max-width:80%;white-space:pre-wrap}.msg.me{background:var(--ac);color:#fff;margin-left:auto}
#call,#pop{position:fixed;inset:0;display:none;flex-direction:column;z-index:9;background:#0d1110;color:#fff}
#pop{background:var(--bg);color:var(--tx)}#pop iframe{flex:1;border:0;background:#fff}
.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 12px}#call video{flex:1;width:100%;min-height:0;background:#000}#call .row{padding:12px}
nav{overflow-x:auto}nav button{min-width:66px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;overflow:auto;padding:16px}
#pl{position:fixed;left:0;right:0;bottom:62px;background:var(--card);border-top:1px solid var(--bd);z-index:5;display:none}#pl iframe{width:100%;border:0;display:block}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(600px 300px at 85% -5%,color-mix(in srgb,var(--ac) 24%,transparent),transparent),radial-gradient(500px 300px at 0 100%,color-mix(in srgb,var(--ac) 14%,transparent),transparent);pointer-events:none;z-index:-1}
.card{border-radius:18px;box-shadow:0 6px 24px #0003;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--card) 88%,transparent);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
button{border-radius:12px;font-weight:600;transition:.15s;box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 30%,transparent)}button:active{transform:scale(.96)}button.g,button.r{box-shadow:none}
input,textarea,select{border-radius:12px}input:focus,textarea:focus,select:focus{outline:2px solid var(--ac);border-color:transparent}
h1{font-size:20px;letter-spacing:.5px}
nav{left:10px;right:10px;bottom:10px;border-radius:22px;border:1px solid var(--bd);backdrop-filter:blur(16px);background:color-mix(in srgb,var(--card) 82%,transparent);box-shadow:0 10px 34px #0005;padding:4px}
nav button{border-radius:16px;box-shadow:none;font-weight:500;color:var(--mut)!important}nav button.on{background:var(--ac2);color:var(--ac)!important}
#pl{bottom:84px;left:10px;right:10px;border-radius:18px;overflow:hidden;border:1px solid var(--bd)}
.gc{max-width:400px;margin:auto;width:100%;display:flex;flex-direction:column;gap:12px}.logo{font-size:56px;text-align:center}
.gbtn{background:#fff;color:#222!important;border:1px solid #ddd;padding:13px;font-size:16px}
</style></head><body>
<main id="app"></main>
<div id="lock"></div><div id="call"></div><div id="gate"></div><div id="pl"><div id="pf"></div><audio id="au" controls style="display:none;width:100%"></audio></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const def={tasks:[],habits:[],journal:[],sessions:[],slips:[],limit:60,pledge:'',cfg:{cid:''},contacts:[],chats:{},kseen:'',updated:0};
const fresh=o=>Object.assign(JSON.parse(JSON.stringify(def)),o);let LK='regain',texp=0,tc=null,tcOk,tcNo;let S=fresh(JSON.parse(localStorage.getItem('regain')||'{}'));
let tab='plan',tok=null,sync='Local only',tm=null,pend=null;
const tabs=[['plan','🗂','Missions'],['exam','🎯','Training'],['timer','⏱','Stakeout'],['track','✅','Protocols'],['katha','🕉','Satsang'],['music','🎧','Bhajans'],['focus','🚫','Shield'],['chat','💬','Comms'],['set','⚙️','HQ']];
function save(){S.updated=Date.now();localStorage.setItem(LK,JSON.stringify(S));clearTimeout(pend);if(tok)pend=setTimeout(push,2000)}
function go(t){tab=t;render();if(t=='music'&&tok&&!BL.length)lsB();if(t=='katha'&&S.kseen!=today()){S.kseen=today();save();openPop()}}
function render(){
 $('#nav').innerHTML=tabs.map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join('');
 $('#app').innerHTML=`<h1><span>PRABODHAM ACADEMY<div class="mut" style="font-size:11px;letter-spacing:2px">// TOP SECRET · AGENT ${esc((S.cfg.user||"UNKNOWN").toUpperCase())}</div></span><span class="pill">${esc(sync)}</span></h1>`+views[tab]();const ml=$('#ml');if(ml)ml.scrollTop=1e9;
}
/* PLAN */
let pd=today();
const views={};
views.plan=()=>{const L=S.tasks.filter(t=>t.date==pd).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
 const done=L.filter(t=>t.done).length;
 return `<div class="card"><div class="row"><button class="g" onclick="shift(-1)">‹</button><input type="date" value="${pd}" onchange="pd=this.value;render()"><button class="g" onclick="shift(1)">›</button></div>
 <div class="row"><input id="tt" placeholder="Add task…"><input id="tm" type="time" style="max-width:110px"><button onclick="addT()">Add</button><button class="g" onclick="addT(1)">Backlog</button></div></div>
 <div class="card"><div class="row"><span class="mut">${done}/${L.length} done</span><button class="g" onclick="mailPlan()">✉ Email plan</button></div><div class="bar"><i style="width:${L.length?done/L.length*100:0}%"></i></div>
 ${L.map(t=>`<div class="t ${t.done?'d':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')"><span class="x">${t.time?`<b>${t.time}</b> `:''}${esc(t.t)}</span><button class="r" onclick="dl('tasks','${t.id}')">✕</button></div>`).join('')||'<div class="mut">Nothing planned. Add your first task.</div>'}</div>`+bk()};
const bk=()=>`<div class="card"><b>📂 Mission backlog (no date)</b>${S.tasks.filter(t=>!t.date).map(t=>`<div class="t ${t.done?'d':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')"><span class="x">${esc(t.t)}</span><button class="r" onclick="dl('tasks','${t.id}')">✕</button></div>`).join('')||'<div class="mut">Empty</div>'}</div>`;
const shift=n=>{const d=new Date(pd+'T00:00');d.setDate(d.getDate()+n);pd=iso(d);render()};
const addT=b=>{const t=$('#tt').value.trim();if(!t)return;S.tasks.push({id:uid(),t,date:b?'':pd,time:$('#tm').value,done:false});save();render()};
const tg=id=>{const t=S.tasks.find(x=>x.id==id);t.done=!t.done;save();render()};
const dl=(k,id)=>{S[k]=S[k].filter(x=>x.id!=id);save();render()};
/* TIMER */
let T={mode:'Focus',left:25*60,run:false,len:{Focus:25,Break:5,Long:15}};
views.timer=()=>{const m=Math.floor(T.left/60),s=T.left%60;
 const td=S.sessions.filter(x=>x.date==today()).reduce((a,b)=>a+b.min,0);
 return `<div class="card"><div class="row">${['Focus','Break','Long'].map(k=>`<button class="${T.mode==k?'':'g'}" onclick="setM('${k}')">${k}</button>`).join('')}</div>
 <div class="big" id="clk">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
 <div class="row"><button onclick="togT()">${T.run?'Pause':'Start'}</button><button class="g" onclick="setM(T.mode)">Reset</button></div>
 <div class="row"><label class="mut">Minutes<input type="number" min="1" value="${T.len[T.mode]}" onchange="T.len[T.mode]=+this.value;setM(T.mode)"></label></div></div>
 <div class="card"><b>Today:</b> ${td} min focused · ${S.sessions.filter(x=>x.date==today()).length} sessions</div>`};
function setM(m){clearInterval(tm);T.mode=m;T.run=false;T.left=T.len[m]*60;render()}
function togT(){if(T.run){clearInterval(tm);T.run=false}else{T.run=true;tm=setInterval(()=>{T.left--;const c=$('#clk');if(c)c.textContent=String(Math.floor(T.left/60)).padStart(2,'0')+':'+String(T.left%60).padStart(2,'0');if(T.left<=0){clearInterval(tm);T.run=false;if(T.mode=='Focus'){S.sessions.push({date:today(),min:T.len.Focus});save()}try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}notify('Regain',T.mode+' complete!');alert(T.mode+' complete!');setM(T.mode=='Focus'?'Break':'Focus')}},1000)}render()}
/* HABITS */
views.track=()=>{const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 return `<div class="card"><div class="row"><input id="hn" placeholder="New habit (e.g. Read 20 pages)"><button onclick="addH()">Add</button></div></div>`+
 S.habits.map(h=>{let st=0,d=new Date();if(!h.days.includes(iso(d)))d.setDate(d.getDate()-1);while(h.days.includes(iso(d))){st++;d.setDate(d.getDate()-1)}
 return `<div class="card"><div class="row"><b>${esc(h.name)}</b><span class="pill" style="flex:none">🔥 ${st} day${st==1?'':'s'}</span><button class="r" onclick="dl('habits','${h.id}')">✕</button></div>
 <div class="row" style="margin-top:8px;justify-content:space-between">${days.map(d=>`<span class="dot ${h.days.includes(iso(d))?'on':''}" onclick="hg('${h.id}','${iso(d)}')">${'SMTWTFS'[d.getDay()]}</span>`).join('')}</div></div>`}).join('')};
const addH=()=>{const n=$('#hn').value.trim();if(!n)return;S.habits.push({id:uid(),name:n,days:[]});save();render()};
const hg=(id,d)=>{const h=S.habits.find(x=>x.id==id);h.days=h.days.includes(d)?h.days.filter(x=>x!=d):[...h.days,d];save();render()};
/* KATHA */
const moods=['😞','😕','😐','🙂','😄'];let mood=3;
const AN='https://anirdesh.com';
const vno=()=>{const d=new Date();return Math.floor((d-new Date(d.getFullYear(),0,0))/864e5)%273+1};
const VU=()=>AN+'/vachanamrut/index.php?format=en&vachno='+vno();
function openPop(u){u=u||VU();if(!window.open(u,'anirdesh','popup=yes,width=460,height=760'))alert('Allow pop-ups for this page, then tap again')}
function mail(sub,body){location.href='mailto:'+(S.cfg.email||'')+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body)}
const mailJ=id=>{const j=S.journal.find(x=>x.id==id);mail('My katha – '+j.date,moods[j.mood]+'\n\n'+j.text)};
const mailPlan=()=>mail('Plan for '+pd,S.tasks.filter(t=>t.date==pd).map(t=>(t.done?'[x] ':'[ ] ')+(t.time||'')+' '+t.t).join('\n')||'No tasks');
views.katha=()=>`<div class="card"><b>🕉 Swaminarayan Satsang Intel</b><div class="mut">Today’s briefing: Vachanamrut discourse ${vno()}. Opens in a pop-up window because Anirdesh blocks in-app embedding.</div><div class="row" style="margin-top:8px"><button onclick="openPop()">📜 Today’s Vachanamrut</button><button class="g" onclick="openPop(AN)">Anirdesh home</button></div></div>
 <div class="card"><div class="mut">Katha notes</div>
 <div class="row" style="justify-content:space-between">${moods.map((m,i)=>`<button class="${i==mood?'':'g'}" onclick="mood=${i};render()">${m}</button>`).join('')}</div>
 <textarea id="jt" rows="4" placeholder="What did you learn from katha today?"></textarea><button onclick="addJ()">Save entry</button></div>`+
 [...S.journal].reverse().map(j=>`<div class="card"><div class="row"><span class="mut">${j.date} ${moods[j.mood]}</span><button class="g" onclick="mailJ('${j.id}')">✉</button><button class="r" onclick="dl('journal','${j.id}')">✕</button></div><div style="white-space:pre-wrap">${esc(j.text)}</div></div>`).join('');
const addJ=()=>{const t=$('#jt').value.trim();if(!t)return;S.journal.push({id:uid(),date:today(),mood,text:t});save();render()};
/* NOTIFY */
function notify(t,b){if(window.Notification&&Notification.permission=='granted'){try{new Notification(t,{body:b})}catch(e){}}}
const fired={};const fire=(id,t,b)=>{if(!fired[id]){fired[id]=1;notify(t,b)}};
setInterval(()=>{const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),k=today()+hm;
 S.tasks.filter(t=>t.date==today()&&!t.done&&t.time==hm).forEach(t=>fire('t'+t.id+k,'⏰ '+t.t,'Due now'));
 if(hm==(S.cfg.kt||'06:00'))fire('k'+k,'📿 Katha time','Read today’s Vachanamrut');
 if(hm==(S.cfg.ht||'21:00'))fire('h'+k,'✅ Habits','Check in your habits for today')},20000);
const askN=()=>window.Notification?Notification.requestPermission().then(render):alert('Notifications unsupported here');
const saveP=()=>{S.cfg.user=$('#un').value.trim().slice(0,24);S.cfg.email=$('#em').value.trim();S.cfg.kt=$('#kt').value;S.cfg.ht=$('#ht').value;save();startPeer();render()};
const profileCard=()=>`<div class="card"><b>Profile & alerts</b>
 <input id="un" placeholder="Display name" value="${esc(S.cfg.user||'')}">
 <input id="em" type="email" placeholder="Your email" value="${esc(S.cfg.email||'')}">
 <label class="mut">Katha reminder<input id="kt" type="time" value="${S.cfg.kt||'06:00'}"></label>
 <label class="mut">Habit reminder<input id="ht" type="time" value="${S.cfg.ht||'21:00'}"></label>
 <div class="row"><button onclick="saveP()">Save</button><button class="g" onclick="askN()">Enable notifications</button></div>
 <div class="mut" style="margin-top:6px">Notifications: ${window.Notification?Notification.permission:'unsupported'} (they fire while the app is open). Chat: ${esc(net)}</div></div>`;
/* COMMS (Firebase: email-based chat, offline delivery, WebRTC voice/video) */
const FBCFG={apiKey:'AIzaSyDk992aVyAlIvGCjJC_Dt0yULqF94jUCSA',authDomain:'prabodham-514509.firebaseapp.com',projectId:'prabodham-514509',storageBucket:'prabodham-514509.firebasestorage.app',messagingSenderId:'1100350122',appId:'1:1100350122:web:ddfa9768937903a3ca86d3'};
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
let peer=null,net='Comms offline',chatWith=null,db=null,me=null,unsubs=[],UID={},pc=null,cid=null,cuns=[],lstream=null,ring=null;
window.alert=m=>{let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:12px;right:12px;top:14px;z-index:99;background:var(--card);color:var(--tx);border:1px solid var(--ac);border-radius:14px;padding:12px;white-space:pre-wrap;box-shadow:0 8px 30px #0008';t.onclick=()=>t.style.display='none';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',7000)};
const myEm=()=>((S.profile&&S.profile.email)||'').toLowerCase();
const armDel=(b,fn)=>{if(b.dataset.a)return fn();b.dataset.a=1;const o=b.textContent;b.textContent='Sure?';setTimeout(()=>{b.dataset.a='';b.textContent=o},3000)};
async function fbInit(){if(db||!FBCFG.projectId||!tok)return;if(!window.firebase){const B='https://www.gstatic.com/firebasejs/10.12.2/firebase-';await loadScript(B+'app-compat.js');await loadScript(B+'auth-compat.js');await loadScript(B+'firestore-compat.js')}
 if(!firebase.apps.length)firebase.initializeApp(FBCFG);const c=await firebase.auth().signInWithCredential(firebase.auth.GoogleAuthProvider.credential(null,tok));me=c.user.uid;db=firebase.firestore()}
async function startPeer(){if(!tok||!myEm())return;if(!FBCFG.projectId){net='Comms server not set up';return}
 try{net='Connecting…';render();unsubs.forEach(f=>f());unsubs=[];await fbInit();
  await db.collection('users').doc(myEm()).set({uid:me,name:S.cfg.user||S.profile.name||''});
  const er=e=>{net='Comms error: '+e.message;render()};
  unsubs.push(db.collection('msgs').where('to','==',me).onSnapshot(sn=>{sn.docChanges().forEach(ch=>{if(ch.type!='added')return;const m=ch.doc.data(),w=m.fromEmail;if(!w)return;if(!S.contacts.includes(w))S.contacts.push(w);(S.names=S.names||{})[w]=m.fromName||'';UID[w]=m.from;addMsg(w,false,m.t);notify('💬 '+(m.fromName||w),m.t);ch.doc.ref.delete()});render()},er));
  unsubs.push(db.collection('calls').where('to','==',me).where('state','==','ringing').onSnapshot(sn=>sn.docChanges().forEach(ch=>{if(ch.type=='added')incoming(ch.doc);if(ch.type=='removed'&&ring&&ring.d.id==ch.doc.id&&!pc){clearTimeout(ring.t);ring=null;$('#call').style.display='none'}}),er));
  peer={destroy(){unsubs.forEach(f=>f());unsubs=[];db=null}};net='Online as '+myEm()}catch(e){net='Comms error: '+e.message}render()}
async function uidOf(e){if(UID[e])return UID[e];const d=await db.collection('users').doc(e).get();if(!d.exists)throw new Error(e+' is not registered in Prabodham Academy yet');return UID[e]=d.data().uid}
const addMsg=(w,m2,t)=>{(S.chats[w]=S.chats[w]||[]).push({me:m2,t,ts:Date.now()});save()};
const openChat=w=>{chatWith=w;render()};
const rmC=w=>{S.contacts=S.contacts.filter(x=>x!=w);delete S.chats[w];if(chatWith==w)chatWith=null;save();render()};
async function addC(){const n=$('#fn').value.trim().toLowerCase();if(!/^[^\s'"<>]+@[^\s'"<>]+\.[^\s'"<>]+$/.test(n))return alert('Enter a valid email address');if(!db)return alert('Comms not connected yet');if(n==myEm())return alert('That is your own email');try{await uidOf(n);if(!S.contacts.includes(n)){S.contacts.push(n);save()}openChat(n)}catch(e){alert(e.message)}}
async function sendM(){const i=$('#mi'),t=i.value.trim().slice(0,1000);if(!t||!db)return;try{await db.collection('msgs').add({from:me,fromEmail:myEm(),fromName:S.cfg.user||'',to:await uidOf(chatWith),t,ts:Date.now()});addMsg(chatWith,true,t);render();$('#mi').focus()}catch(e){alert('Not sent: '+e.message)}}
const nm=w=>(S.names&&S.names[w])?S.names[w]+' · '+w:w;
views.chat=()=>{if(!myEm())return '<div class="card">Sign in with Google to use Comms.</div>';
 let h=`<div class="card"><div class="mut">${esc(net)}</div>${window!==window.top?'<button class="g" onclick="window.open(location.href)" style="margin:6px 0">Open full app for calls ↗</button><div class="mut">Voice/video calls are blocked inside embedded pages.</div>':''}<div class="row"><input id="fn" type="email" placeholder="Friend’s Gmail address"><button onclick="addC()">Add</button></div></div>`;

G.Chemistry.push(()=>{const z=R(3,30);return qn('Chemistry',`Electrons in a neutral atom of atomic number ${z}?`,z,[z+1,z-1,z*2])},()=>{const n=R(1,4),m=R(2,5);return qn('Chemistry',`Mass (g) of ${n} mol of a substance with molar mass ${m*10} g/mol?`,n*m*10,[m*10,n*m,n+m*10])},()=>{const c=R(1,9),v=R(2,9);return qn('Chemistry',`Moles of solute in ${v} L of ${c} M solution?`,c*v,[c+v,c*v*2,c*v+1])});

views.music=()=>`<div class="card"><b>🎧 Bhajan radio</b><div class="mut">Paste a Spotify or YouTube link. The player stays on while you switch tabs.</div><input id="bu" placeholder="https://open.spotify.com/playlist/…"><div class="row"><button onclick="playU($('#bu').value)">▶ Play</button><button class="g" onclick="saveB()">Save link</button></div>${(S.bh||[]).map((b,i)=>`<div class="t"><span class="x" onclick="playU(S.bh[${i}])">▶ ${esc(b.slice(0,44))}</span><button class="r" onclick="S.bh.splice(${i},1);save();render()">✕</button></div>`).join('')}</div>
<div class="card"><b>🗄 Bhajan vault (your Drive)</b><div class="mut">Add your own audio files. They’re stored in your Google Drive and play in-app. Spotify/YouTube audio can’t be downloaded.</div><input type="file" accept="audio/*" multiple onchange="addB(this.files)"><button class="g" onclick="lsB()">Refresh vault</button>${BL.map((f,i)=>`<div class="t"><span class="x" onclick="playD(${i})">▶ ${esc(f.name.slice(7))}</span><button class="g" onclick="dlD(${i})">⬇</button></div>`).join('')}</div>`;
/* AUTH & DRIVE */
const CLIENT_ID='1100350122-98pqs0375hnun47j3ifo8dbru5kc5o02.apps.googleusercontent.com'; // OWNER: paste your Google OAuth Client ID here once, then host the file. Everyone else just signs in.
const SC='openid email profile https://www.googleapis.com/auth/drive.appdata';
const cidv=()=>CLIENT_ID||localStorage.getItem('pa:cid')||'';
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function gtc(){if(tc)return tc;if(!(window.google&&google.accounts))await loadScript('https://accounts.google.com/gsi/client');tc=google.accounts.oauth2.initTokenClient({client_id:cidv(),scope:SC,callback:r=>r.error?tcNo(r):tcOk(r),error_callback:e=>tcNo(e)});return tc}
const askTok=p=>new Promise(async(ok,no)=>{tcOk=ok;tcNo=no;try{(await gtc()).requestAccessToken({prompt:p})}catch(e){no(e)}});
const setMsg=m=>{const e=$('#gm');if(e)e.textContent=m};
const hideGate=()=>{$('#gate').style.display='none';$('#gate').innerHTML=''};
function gate(msg){if(tok)return;const g=$('#gate');g.style.display='flex';g.innerHTML=`<div class="gc"><div class="logo">🛡️</div><h1 style="justify-content:center">PRABODHAM ACADEMY</h1><div class="mut" style="text-align:center;letter-spacing:3px;font-size:11px">// SECURE AGENT PORTAL</div>
 ${cidv()?'':`<p class="mut">Owner setup (once): console.cloud.google.com → new project → enable <b>Google Drive API</b> → OAuth consent screen (External, add test users) → Credentials → OAuth client ID (Web) → add this page’s https URL under Authorized JavaScript origins. Paste the ID below, or hard-code it in the CLIENT_ID line of this file.</p><input id="cid" placeholder="App ID (….apps.googleusercontent.com)">`}
 <button class="gbtn" onclick="signIn()"><b style="color:#4285f4">G</b>&nbsp; Sign in / Sign up with Google</button><div id="gm" class="mut" style="text-align:center;min-height:18px">${esc(msg||'')}</div><div class="mut" style="text-align:center"><a href="#" onclick="hideGate();return false" style="color:inherit">Continue as guest (no Drive)</a></div></div>`}
async function signIn(){const c=$('#cid');if(c&&c.value.trim()){localStorage.setItem('pa:cid',c.value.trim());tc=null}if(!cidv())return setMsg('Paste the App ID first');
 try{setMsg('Opening Google…');await afterTok(await askTok('select_account'))}catch(e){setMsg('Sign-in failed: '+(e.type||e.error||e.message||'cancelled'))}}
async function afterTok(r){tok=r.access_token;texp=Date.now()+(r.expires_in-60)*1e3;
 const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();
 LK='pa:'+u.sub;S=fresh(JSON.parse(localStorage.getItem(LK)||'{}'));S.profile={name:u.name,email:u.email,pic:u.picture};
 sessionStorage.setItem('pa:s',JSON.stringify({tok,texp,sub:u.sub}));sync='Connected';hideGate();applyTheme();try{await fbInit()}catch(e){net='Comms error: '+e.message}await pull();
 if(!S.cfg.user)onboard();else{render();startPeer()}}
function onboard(){const g=$('#gate');g.style.display='flex';g.innerHTML=`<div class="gc"><div class="logo">🕵️</div><h1 style="justify-content:center">Create agent profile</h1><div class="mut" style="text-align:center">Welcome ${esc(S.profile.name||'')}. Choose a display name. Friends find you in Comms by your Gmail address.</div><input id="gn" placeholder="Display name"><label class="mut">Target exam<select id="ge"><option>JEE Main</option><option>JEE Advanced</option><option>Other</option></select></label><button onclick="finishOb()">Begin mission</button></div>`}
function finishOb(){const n=$('#gn').value.trim().slice(0,24);if(n.length<2)return alert('Enter a display name');S.cfg.user=n;S.cfg.exam=$('#ge').value;save();hideGate();render();startPeer();push()}
function signOut(){try{google.accounts.oauth2.revoke(tok)}catch(e){}tok=null;sessionStorage.removeItem('pa:s');LK='regain';S=fresh({});if(peer){peer.destroy();peer=null}sync='Signed out';applyTheme();render();gate()}
function restore(){try{const ss=JSON.parse(sessionStorage.getItem('pa:s')||'null');if(ss&&ss.texp>Date.now()&&cidv()){tok=ss.tok;texp=ss.texp;LK='pa:'+ss.sub;S=fresh(JSON.parse(localStorage.getItem(LK)||'{}'));sync='Connected';applyTheme();render();pull().then(()=>{if(S.cfg.user)startPeer()});return}}catch(e){}gate();if(S.cfg.user)startPeer()}
async function api(url,o={}){if(!tok)throw new Error('Not signed in');if(Date.now()>texp){try{const r=await askTok('');tok=r.access_token;texp=Date.now()+(r.expires_in-60)*1e3}catch(e){tok=null;sync='Session expired';render();gate('Session expired – sign in again');throw new Error('Session expired – sign in again')}}
 o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});const r=await fetch(url,o);if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(r.status+' '+m)}return r}
const fail=e=>{sync='⚠ '+String(e.message).slice(0,40);render();console.error(e);alert('Drive problem: '+e.message+'\n\nIf it mentions "accessNotConfigured" or "has not been used", enable the Google Drive API in your Google Cloud project.')};
const DF="https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=files(id,name)";
async function fid(){const f=((await(await api(DF)).json()).files||[]).find(x=>x.name=='prabodham-data.json');return f&&f.id}
async function pull(){if(!tok)return;try{sync='Syncing…';render();const id=await fid();if(id){const d=await(await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();if((d.updated||0)>S.updated){const pf=S.profile;S=fresh(d);S.profile=pf;localStorage.setItem(LK,JSON.stringify(S));applyTheme()}}if(S.cfg.user)await push();else{sync='New agent';render()}}catch(e){fail(e)}}
async function push(){if(!tok)return;try{const id=await fid();const meta=id?{}:{name:'prabodham-data.json',parents:['appDataFolder']},b='rgn';
 await api(`https://www.googleapis.com/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`});
 sync='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});render()}catch(e){fail(e)}}
async function driveTest(){try{const f=(await(await api(DF)).json()).files||[];alert('Drive OK ✅\n'+f.length+' files in your private app folder\nBhajans: '+f.filter(x=>x.name.startsWith('bhajan-')).length)}catch(e){fail(e)}}
views.set=()=>`<div class="card" style="text-align:center">${S.profile?`<img src="${esc(S.profile.pic||'')}" width="64" height="64" style="border-radius:50%" referrerpolicy="no-referrer" alt=""><div><b>${esc(S.profile.name||'')}</b></div><div class="mut">${esc(S.profile.email||'')}</div>`:'<div class="mut">Guest mode – nothing is saved to Drive</div>'}
 <div class="row" style="margin-top:10px">${tok?'<button class="g" onclick="driveTest()">Test Drive</button><button class="g" onclick="push()">Sync now</button><button class="r" onclick="signOut()">Sign out</button>':'<button onclick="gate()">Sign in</button>'}</div><div class="mut" style="margin-top:6px">${esc(sync)}</div></div>`+themeCard()+profileCard()+`<div class="card"><b>Backup file</b><div class="row" style="margin-top:6px"><button class="g" onclick="expB()">Export</button><button class="g" onclick="$('#imp').click()">Import</button></div><input id="imp" type="file" accept=".json" hidden onchange="impB(this.files[0])"></div>`;
const expB=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='prabodham-backup.json';a.click()};
const impB=f=>{const r=new FileReader();r.onload=()=>{try{const pf=S.profile;S=fresh(JSON.parse(r.result));S.profile=pf;save();applyTheme();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)};
applyTheme();render();restore();
</script></body></html>
