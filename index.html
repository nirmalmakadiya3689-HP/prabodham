</style></head><body>
<main id="app"></main>
<div id="lock"></div><div id="call"></div><div id="gate"></div><button id="fab">✦</button><div id="fm"></div><div id="pl"><div id="pf"></div><audio id="au" controls style="display:none;width:100%"></audio></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const today=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const def={tasks:[],habits:[],journal:[],sessions:[],slips:[],limit:60,pledge:'',cfg:{cid:''},contacts:[],chats:{},kseen:'',updated:0};
const fresh=o=>Object.assign(JSON.parse(JSON.stringify(def)),o);let LK='regain',texp=0,tc=null,tcOk,tcNo;let S=fresh(JSON.parse(localStorage.getItem('regain')||'{}'));
let tab='plan',tok=null,sync='Local only',tm=null,pend=null;
const tabs=[['plan','🗂','Missions'],['stats','📊','Week'],['exam','🎯','Training'],['timer','⏱','Stakeout'],['track','✅','Protocols'],['katha','🕉','Satsang'],['music','🎧','Bhajans'],['focus','🚫','Shield'],['chat','💬','Comms'],['set','⚙️','HQ']];
function save(){S.updated=Date.now();localStorage.setItem(LK,JSON.stringify(S));clearTimeout(pend);if(tok)pend=setTimeout(push,2000)}
function go(t){tab=t;render();if(t=='music'&&tok&&!BL.length)lsB();if(t=='katha'&&S.cfg.autopop!==0&&S.kseen!=today()){S.kseen=today();save();openPop()}}
const PI={plan:'<rect x="3" y="4" width="18" height="18" rx="2.5"/><path d="M16 2v4M8 2v4M3 10h18"/>',stats:'<path d="M3 3v18h18"/><path d="M8 16v-5M13 16V7M18 16v-8"/>',exam:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',timer:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/>',track:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',katha:'<path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2zM22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/>',music:'<path d="M3 14v-2a9 9 0 0 1 18 0v2"/><rect x="3" y="14" width="4" height="7" rx="1.5"/><rect x="17" y="14" width="4" height="7" rx="1.5"/>',focus:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/>',chat:'<path d="M21 12a8 8 0 0 1-11.5 7.2L3 21l1.8-6.5A8 8 0 1 1 21 12z"/>',set:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'};
const IC=(k,z=20)=>`<svg viewBox="0 0 24 24" width="${z}" height="${z}" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${PI[k]||''}</svg>`;
const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const heroH=()=>{const tt=S.tasks.filter(t=>t.date==today()),f=S.sessions.filter(x=>x.date==today()).reduce((a,b)=>a+b.min,0);return `<div class="hero"><div class="mut">${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'long'})}</div><div class="hd">${greet()}, ${esc(S.cfg.user||'agent')}</div><div class="chips"><span class="pill">${tt.filter(t=>!t.done).length} open tasks</span><span class="pill">${f} min focus</span><span class="pill">${reelN()} reels</span></div></div>`};
let lastTab=null;
function render(){const nv=$('#nav'),nl=nv.scrollLeft,sy=window.scrollY,ae=document.activeElement,fid=ae&&ae.id&&ae.closest&&ae.closest('#app')?ae.id:null,fv=fid?ae.value:null,ss=fid?ae.selectionStart:null,hid=S.cfg.hide||[];
 nv.innerHTML=tabs.filter(t=>t[0]=='set'||!hid.includes(t[0])).map(([k,i,l])=>`<button class="${k==tab?'on':''}" onclick="go('${k}')">${IC(k)}<em>${l}</em></button>`).join('');nv.scrollLeft=nl;
 $('#app').innerHTML=`<div class="brand"><span class="lg">${IC('focus',22)}</span><div style="flex:1;min-width:0"><div class="bt">Prabodham Academy</div><div class="bs">${esc(S.cfg.user||'guest')} · classified</div></div><span class="pill sy">${esc(sync)}</span></div>`+views[tab]();
 if(fid){const e=document.getElementById(fid);if(e&&e.type!='file'){e.value=fv;e.focus();try{e.setSelectionRange(ss,ss)}catch(x){}}}
 const ml=$('#ml');if(ml)ml.scrollTop=1e9;window.scrollTo(0,lastTab==tab?sy:0);lastTab=tab;if(tab=='exam')rmath($('#app'))}
/* PLAN */
let pd=today();
const views={};
const HRS=[...Array(19)].map((_,i)=>i+5);
const nextUp=()=>{const n=new Date(),nm=n.getHours()*60+n.getMinutes();let b=null;S.tasks.filter(t=>t.date==today()&&!t.done&&t.time).forEach(t=>{const d=+t.time.slice(0,2)*60+ +t.time.slice(3)-nm;if(d>=0&&(!b||d<b.d))b={t,d}});return b};
const slot=h=>{$('#tm').value=h+':00';$('#tt').focus()};
const trow=t=>`<div class="t ${t.done?'d':''}"><input type="checkbox" ${t.done?'checked':''} onchange="tg('${t.id}')"><span class="x">${t.time&&t.time.slice(3)!='00'?'<b>'+t.time+'</b> ':''}${esc(t.t)}</span><button class="r" onclick="dl('tasks','${t.id}')">✕</button></div>`;
views.plan=()=>{const L=S.tasks.filter(t=>t.date==pd),done=L.filter(t=>t.done).length,nx=pd==today()?nextUp():null,inT=t=>t.time&&+t.time.slice(0,2)>=5;
 const rows=HRS.map(h=>{const hh=String(h).padStart(2,'0'),it=L.filter(t=>inT(t)&&t.time.slice(0,2)==hh).sort((a,b)=>a.time.localeCompare(b.time));return `<tr><td class="ht" onclick="slot('${hh}')">${hh}:00</td><td>${it.map(trow).join('')||`<span class="mut" onclick="slot('${hh}')">＋</span>`}</td></tr>`}).join('');
 const un=L.filter(t=>!inT(t));
 return heroH()+`<div class="card"><div class="row"><button class="g" onclick="shift(-1)">‹</button><input type="date" value="${pd}" onchange="pd=this.value;render()"><button class="g" onclick="shift(1)">›</button></div>
 <input id="tt" placeholder="Add a task…"><div class="row"><input id="tm" type="time"><button onclick="addT()">Add</button><button class="g" onclick="addT(1)">Backlog</button></div></div>`+(nx?`<div class="card nx">⏰ Next: <b>${nx.t.time} ${esc(nx.t.t)}</b> · in ${nx.d} min</div>`:'')+
 `<div class="card"><div class="row"><span class="mut">${done}/${L.length} done</span><button class="g" onclick="autoDay()">✨ Auto-fill day</button><button class="g" onclick="mailPlan()">✉</button></div><div class="bar" style="margin:6px 0"><i style="width:${L.length?done/L.length*100:0}%"></i></div><table class="tb">${rows}</table>${un.length?'<div class="mut" style="margin-top:6px">Other times / no time</div>'+un.map(trow).join(''):''}</div>`+bk()};
const DEF=[['05:30','Wake · prayer'],['06:00','Katha / Vachanamrut reading'],['07:00','Exercise · freshen up'],['08:00','Breakfast'],['09:00','Physics study'],['11:00','Chemistry study'],['13:00','Lunch · rest'],['15:00','Maths practice'],['17:00','Revision · formulas'],['18:30','Evening prayer · walk'],['20:00','JEE practice test'],['21:30','Journal · plan tomorrow'],['22:30','Sleep']];

const CLIENT_ID='1100350122-98pqs0375hnun47j3ifo8dbru5kc5o02.apps.googleusercontent.com'; // OWNER: paste your Google OAuth Client ID here once, then host the file. Everyone else just signs in.
const SC='openid email profile https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/youtube.readonly';
const cidv=()=>CLIENT_ID||localStorage.getItem('pa:cid')||'';
const loadScript=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.appendChild(e)});
async function gtc(){if(tc)return tc;if(!(window.google&&google.accounts))await loadScript('https://accounts.google.com/gsi/client');tc=google.accounts.oauth2.initTokenClient({client_id:cidv(),scope:SC,callback:r=>r.error?tcNo(r):tcOk(r),error_callback:e=>tcNo(e)});return tc}
const askTok=p=>new Promise(async(ok,no)=>{tcOk=ok;tcNo=no;try{(await gtc()).requestAccessToken({prompt:p})}catch(e){no(e)}});
const setMsg=m=>{const e=$('#gm');if(e)e.textContent=m};
const hideGate=()=>{$('#gate').style.display='none';$('#gate').innerHTML=''};
function gate(msg){if(tok)return;const g=$('#gate');g.style.display='flex';g.innerHTML=`<div class="gc"><div class="logo" style="color:var(--ac)">${IC('focus',46)}</div><div class="hd" style="text-align:center;font-size:32px">Prabodham Academy</div><div class="mut" style="text-align:center;line-height:1.5">Plan your day. Focus deeply. Grow with satsang.<br>Everything is backed up to your own Google Drive.</div>
 ${cidv()?'':`<p class="mut">Owner setup (once): console.cloud.google.com → new project → enable <b>Google Drive API</b> → OAuth consent screen (External, add test users) → Credentials → OAuth client ID (Web) → add this page’s https URL under Authorized JavaScript origins. Paste the ID below, or hard-code it in the CLIENT_ID line of this file.</p><input id="cid" placeholder="App ID (….apps.googleusercontent.com)">`}
 <button class="gbtn" onclick="signIn()"><b style="color:#4285f4">G</b>&nbsp; Sign in / Sign up with Google</button><div id="gm" class="mut" style="text-align:center;min-height:18px">${esc(msg||'')}</div><div class="mut" style="text-align:center"><a href="#" onclick="hideGate();return false" style="color:inherit">Continue as guest (no Drive)</a></div></div>`}
async function signIn(){const c=$('#cid');if(c&&c.value.trim()){localStorage.setItem('pa:cid',c.value.trim());tc=null}if(!cidv())return setMsg('Paste the App ID first');
 try{setMsg('Opening Google…');await afterTok(await askTok('select_account'))}catch(e){setMsg('Sign-in failed: '+(e.type||e.error||e.message||'cancelled'))}}
async function afterTok(r){tok=r.access_token;texp=Date.now()+(r.expires_in-60)*1e3;
 const u=await(await fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+tok}})).json();
 LK='pa:'+u.sub;S=fresh(JSON.parse(localStorage.getItem(LK)||'{}'));S.profile={name:u.name,email:u.email,pic:u.picture};
 sessionStorage.setItem('pa:s',JSON.stringify({tok,texp,sub:u.sub}));sync='Connected';hideGate();applyTheme();try{await fbInit()}catch(e){net='Comms error: '+e.message}await pull();
 if(!S.cfg.user)onboard();else{render();startPeer()}}
function onboard(){const g=$('#gate');g.style.display='flex';g.innerHTML=`<div class="gc"><div class="logo">🕵️</div><h1 style="justify-content:center">Create agent profile</h1><div class="mut" style="text-align:center">Welcome ${esc(S.profile.name||'')}. Choose a display name. Friends find you in Comms by your Gmail address.</div><input id="gn" placeholder="Display name"><label class="mut">Target exam<select id="ge"><option>JEE Main</option><option>JEE Advanced</option><option>Other</option></select></label><button onclick="finishOb()">Begin mission</button></div>`}
function finishOb(){const n=$('#gn').value.trim().slice(0,24);if(n.length<2)return alert('Enter a display name');S.cfg.user=n;S.cfg.exam=$('#ge').value;save();hideGate();render();startPeer();push()}
function signOut(){try{google.accounts.oauth2.revoke(tok)}catch(e){}tok=null;sessionStorage.removeItem('pa:s');LK='regain';S=fresh({});if(peer){peer.destroy();peer=null}sync='Signed out';applyTheme();render();gate()}
function restore(){try{const ss=JSON.parse(sessionStorage.getItem('pa:s')||'null');if(ss&&ss.texp>Date.now()&&cidv()){tok=ss.tok;texp=ss.texp;LK='pa:'+ss.sub;S=fresh(JSON.parse(localStorage.getItem(LK)||'{}'));sync='Connected';applyTheme();render();pull().then(()=>{if(S.cfg.user)startPeer()});return}}catch(e){}gate();if(S.cfg.user)startPeer()}
async function api(url,o={}){if(!tok)throw new Error('Not signed in');if(Date.now()>texp){try{const r=await askTok('');tok=r.access_token;texp=Date.now()+(r.expires_in-60)*1e3}catch(e){tok=null;sync='Session expired';render();gate('Session expired – sign in again');throw new Error('Session expired – sign in again')}}
 o.headers=Object.assign({Authorization:'Bearer '+tok},o.headers||{});const r=await fetch(url,o);if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error(r.status+' '+m)}return r}
const fail=e=>{sync='⚠ '+String(e.message).slice(0,40);render();console.error(e);alert('Drive problem: '+e.message+'\n\nIf it mentions "accessNotConfigured" or "has not been used", enable the Google Drive API in your Google Cloud project.')};
const DF="https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=files(id,name)";
async function fid(){const f=((await(await api(DF)).json()).files||[]).find(x=>x.name=='prabodham-data.json');return f&&f.id}
async function pull(){if(!tok)return;try{sync='Syncing…';render();const id=await fid();if(id){const d=await(await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json();if((d.updated||0)>S.updated){const pf=S.profile;S=fresh(d);S.profile=pf;localStorage.setItem(LK,JSON.stringify(S));applyTheme()}}if(S.cfg.user)await push();else{sync='New agent';render()}}catch(e){fail(e)}}
async function push(){if(!tok)return;try{const id=await fid();const meta=id?{}:{name:'prabodham-data.json',parents:['appDataFolder']},b='rgn';
 await api(`https://www.googleapis.com/upload/drive/v3/files${id?'/'+id:''}?uploadType=multipart`,{method:id?'PATCH':'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(S)}\r\n--${b}--`});
 sync='Saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});render()}catch(e){fail(e)}}
async function driveTest(){try{const f=(await(await api(DF)).json()).files||[];alert('Drive OK ✅\n'+f.length+' files in your private app folder\nBhajans: '+f.filter(x=>x.name.startsWith('bhajan-')).length)}catch(e){fail(e)}}
views.set=()=>`<div class="card" style="text-align:center">${S.profile?`<img src="${esc(S.profile.pic||'')}" width="64" height="64" style="border-radius:50%" referrerpolicy="no-referrer" alt=""><div><b>${esc(S.profile.name||'')}</b></div><div class="mut">${esc(S.profile.email||'')}</div>`:'<div class="mut">Guest mode – nothing is saved to Drive</div>'}
 <div class="row" style="margin-top:10px">${tok?'<button class="g" onclick="driveTest()">Test Drive</button><button class="g" onclick="push()">Sync now</button><button class="r" onclick="signOut()">Sign out</button>':'<button onclick="gate()">Sign in</button>'}</div><div class="mut" style="margin-top:6px">${esc(sync)}</div></div>`+instCard()+themeCard()+profileCard()+`<div class="card"><b>Backup file</b><div class="row" style="margin-top:6px"><button class="g" onclick="expB()">Export</button><button class="g" onclick="$('#imp').click()">Import</button></div><input id="imp" type="file" accept=".json" hidden onchange="impB(this.files[0])"><div class="row" style="margin-top:6px"><button class="r" onclick="armDel(this,delBackup)">Delete cloud backup</button><button class="r" onclick="armDel(this,()=>{S.qb=[];save();render()})">Delete imported questions</button></div></div>`;
const expB=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='prabodham-backup.json';a.click()};
const impB=f=>{const r=new FileReader();r.onload=()=>{try{const pf=S.profile;S=fresh(JSON.parse(r.result));S.profile=pf;save();applyTheme();render()}catch(e){alert('Invalid backup file')}};r.readAsText(f)};
applyTheme();render();initFab();restore();restoreLock();
</script></body></html>
